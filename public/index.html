<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neoron · Leads Negociando</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="login" class="login-scrim" hidden>
    <form class="login-card" id="login-form">
      <div class="login-brand"><span class="logo">EN</span><b>ExtractNeoron</b></div>
      <p class="login-sub">Entre com sua conta do Neoron</p>
      <label>E-mail<input type="email" id="login-email" autocomplete="username" required></label>
      <label>Senha<input type="password" id="login-pass" autocomplete="current-password" required></label>
      <button class="primary" type="submit" id="login-btn">Entrar</button>
      <p class="login-err" id="login-err" hidden></p>
    </form>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="logo">EN</span>
      <div><h1>ExtractNeoron</h1><p class="sub" id="meta">Leads em Negociação</p></div>
    </div>
    <nav class="tabs">
      <a class="tab active" href="/">Leads</a>
      <a class="tab" href="/timeline.html">Métricas</a>
    </nav>
    <div class="actions">
      <span id="auto" class="auto" title="Atualização automática">—</span>
      <button id="btn-extract" class="primary">Extrair</button>
      <div class="menu">
        <button id="btn-export">Exportar</button>
        <div class="menu-list" id="export-menu" hidden>
          <a href="#" data-dl="xlsx">Excel (.xlsx)</a>
          <a href="#" data-dl="csv">CSV</a>
        </div>
      </div>
      <button id="btn-catalog" title="Importar catálogo (.json) para casar produtos por SKU">Catálogo</button>
      <input type="file" id="catalog-file" accept="application/json,.json" hidden />
      <div class="usermenu">
        <button id="user-chip" class="user-chip"><span class="avatar" id="user-initial">·</span><span id="user-name">—</span></button>
        <div class="menu-list" id="user-menu" hidden><a href="#" id="btn-logout">Sair</a></div>
      </div>
    </div>
  </header>

  <section class="stats" id="stats" hidden>
    <div class="stat"><span id="s-abertos">0</span><label>Abertos</label></div>
    <div class="stat"><span id="s-quentes">0</span><label>Quentes</label></div>
    <div class="stat"><span id="s-aguard">0</span><label>Aguardando resposta</label></div>
    <div class="stat"><span id="s-vendidos">0</span><label>Vendidos</label></div>
    <div class="stat"><span id="s-when">—</span><label>Atualizado</label></div>
  </section>

  <section class="toolbar" id="toolbar" hidden>
    <div class="seg" id="seg-situacao">
      <button data-v="Aberto" class="active">Abertos</button>
      <button data-v="all">Todos</button>
      <button data-v="Vendido">Vendidos</button>
      <button data-v="Descartado">Descartados</button>
    </div>
    <div class="chips" id="chips-temp">
      <button data-t="quente" class="chip q active">Quente</button>
      <button data-t="morno" class="chip m active">Morno</button>
      <button data-t="frio" class="chip f active">Frio</button>
    </div>
    <label class="check"><input type="checkbox" id="hide-done" checked /> Ocultar concluídos</label>
    <input id="search" type="search" placeholder="Buscar nome, telefone, produto, atendente…" />
    <span class="counter" id="counter"></span>
  </section>

  <main>
    <table id="tbl">
      <thead>
        <tr>
          <th data-k="nome">Lead</th>
          <th data-k="contato">Telefone</th>
          <th data-k="produto">Produto</th>
          <th data-k="atendente">Atendente</th>
          <th data-k="ultimaInteracaoMs">Última mensagem</th>
          <th data-k="contexto">Contexto</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr class="empty"><td colspan="7">Sem dados ainda.</td></tr>
      </tbody>
    </table>
  </main>

  <div id="overlay" hidden><div class="spinner"></div><p id="overlay-msg">Extraindo do Neoron…</p></div>
  <script src="/config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
