# ExtractNeoron — internal/VPN deployment.
# The dashboard is published ONLY on 127.0.0.1 of the VPS: reach it via an SSH
# tunnel (ssh -L 3000:127.0.0.1:3000 user@vps) or your VPN. It is never exposed
# to the public internet by this file.
services:
  app:
    build: .
    image: extractneoron:latest
    container_name: extractneoron
    env_file: .env
    environment:
      HOST: 0.0.0.0        # bind inside the container; the port map below scopes exposure
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"   # host-local only; change 3000 on both sides if PORT differs
    volumes:
      - neoron-data:/app/data   # persists "Feito" state, history, imported catalog
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  neoron-data:
